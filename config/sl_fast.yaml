stage: supervised
name: fast_sl

data:
  games: data/processed/games/pro_v1
  include_pass: false
  augment: true
  shuffle_buffer: 20000
  val_sample_every: 8
  workers: 1

encoder:
  name: sevenplane
  board_size: 19
  kwargs: {}

model:
  class: SmallResidualNetwork
  kwargs:
    channel_size: 7
    board_size: 19
    num_blocks: 6

train:
  batch_size: 256
  lr: 0.05
  momentum: 0.9
  weight_decay: 0.0001
  warmup_steps: 2000
  total_steps: 300000
  amp: true
  log_every: 200
  eval_every: 5000
  save_every: 2000
  snapshot_every: 50000
