stage: supervised
name: alphago_sl

data:
  games: data/processed/games/pro_v1
  include_pass: true
  augment: true
  shuffle_buffer: 20000
  val_sample_every: 8
  workers: 4

encoder:
  name: alphago
  board_size: 19
  kwargs: {}

model:
  class: AlphaGo
  kwargs:
    board_size: 19
    in_channels: 48
    num_filters: 192
    num_layers: 13

train:
  batch_size: 256
  lr: 0.05
  momentum: 0.9
  weight_decay: 0.0001
  warmup_steps: 2000
  total_steps: 300000
  amp: true
  log_every: 200
  eval_every: 5000
  save_every: 2000
  snapshot_every: 50000
