name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }} --venv

      - name: Install dependencies
        run: uv pip install -e .[test]

      - name: Run tests
        # Running via 'uv run' ensures the correct virtualenv is used
        run: uv run pytest -v --cov=alphago
