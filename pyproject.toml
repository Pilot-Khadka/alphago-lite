[project]
name = "alphago"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pilot-Khadka", email = "khdpilot@gmail.com" }
]
requires-python = ">=3.10.18, <4.0"
dependencies = [
    "h5py>=3.14.0",
    "torch>=2.7.1",
    "tqdm (>=4.67.1,<5.0.0)",
    "flask (>=3.1.1,<4.0.0)",
    "flask-cors (>=6.0.1,<7.0.0)",
    "flask-socketio (>=5.5.1,<6.0.0)",
    "eventlet (>=0.40.2,<0.41.0)",
]

[project.scripts]
alphago = "alphago:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dlgo"]

[dependency-groups]
dev = [
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "ruff>=0.12.7",
]
[tool.ruff]
select = ["Q", "E"]  # Enables quote and string normalization rules

